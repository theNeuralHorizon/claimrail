name: Deploy

# Runs right after a push to main. The actual deploy is owned by Render
# (auto-deploy from the main branch), and the Render web service runs
# `npx tsx lib/db/migrate.ts && npm start` on every boot — so migrations
# travel with the deploy. This workflow exists only to smoke-test the
# deployed URL afterwards so a bad deploy turns CI red.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   DEPLOY_URL   https://claimrail-tj98.onrender.com (or your custom domain)
#
# If DEPLOY_URL isn't set the workflow logs a warning and skips, so fresh
# forks stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Don't run two smoke tests against the same deployment in parallel.
  group: deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
    steps:
      - name: Wait for deployment + smoke-test /api/health
        if: env.DEPLOY_URL != ''
        run: |
          set -euo pipefail
          # Up to 12 attempts × 15s = 3min of patience for Render's
          # promote-to-production after the git push.
          for attempt in $(seq 1 12); do
            echo "attempt $attempt → $DEPLOY_URL/api/health"
            response_file=$(mktemp)
            http_code=$(curl --silent --show-error --max-time 10 \
              -w "%{http_code}" \
              -o "$response_file" \
              "$DEPLOY_URL/api/health" || echo "CURL_ERROR")
            
            body=$(cat "$response_file")
            rm -f "$response_file"

            if [ "$http_code" = "503" ] && echo "$body" | grep -q -i -E "suspended|suspension"; then
              echo "::error::The Render deployment at $DEPLOY_URL is suspended or disabled (503 Service Suspended). Please unsuspend your service in the Render dashboard."
              exit 1
            fi

            if echo "$body" | grep -q '"service":"claimrail"'; then
              echo "ok — health endpoint reachable"
              echo "$body"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployed site did not serve a healthy /api/health after 3 minutes"
          exit 1

      - name: Note skipped smoke test
        if: env.DEPLOY_URL == ''
        run: |
          echo "::warning::Skipped smoke test — DEPLOY_URL secret not set."
