name: Probe cron

# Hits /api/cron/probes every 5 minutes (the smallest interval GitHub
# Actions schedule supports). The endpoint walks every active vendor in
# every org and records a fresh uptime probe — driving the dashboard
# numbers and the auto-claim drafting pipeline.
#
# GitHub's scheduled events are best-effort: actual fire times can drift
# 5–15 minutes under load. That's acceptable for SLA monitoring at this
# scale. If sub-minute precision becomes a requirement later, swap to
# Render's paid cron tier ($1/mo) using mcp__render__create_cron_job.
#
# Required repo secrets:
#   APP_URL       https://claimrail-tj98.onrender.com (or custom domain)
#   CRON_SECRET   matches the value set on the Render web service

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-cron
  cancel-in-progress: false

jobs:
  hit-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/probes
        if: env.APP_URL != '' && env.CRON_SECRET != ''
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST \
            -w "%{http_code}" \
            -o "$response_file" \
            "$APP_URL/api/cron/probes" || echo "CURL_ERROR")

          body=$(cat "$response_file")
          rm -f "$response_file"

          if [ "$http_code" = "503" ] && echo "$body" | grep -q -i -E "suspended|suspension"; then
            echo "::warning::The live deployment at $APP_URL is suspended on the hosting provider. Skipping probe gracefully to avoid CI notification spam."
            exit 0
          elif [ "$http_code" = "CURL_ERROR" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Request failed with HTTP status $http_code"
            echo "Response body:"
            echo "$body"
            exit 22
          fi

      - name: Note skipped probe
        if: env.APP_URL == '' || env.CRON_SECRET == ''
        run: |
          echo "::warning::Skipped probe — APP_URL / CRON_SECRET secrets not set."
