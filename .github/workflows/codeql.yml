name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan, Monday 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Private repos require GitHub Advanced Security for the SARIF upload
      # to succeed. We still run the analysis — results surface in the action
      # logs and anyone with GHAS turned on later will get alerts automatically
      # — but we don't want the upload gate to fail the whole job while the
      # repo is on the free plan.
      - name: Analyze
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

      - name: Note analyze outcome
        if: always()
        run: |
          if [ "${{ steps.analyze.outcome }}" = "success" ]; then
            echo "::notice::CodeQL analyze + upload succeeded."
          else
            echo "::warning::CodeQL upload skipped or failed (expected on private repos without GitHub Advanced Security). The scan itself ran — see the Analyze step logs for findings."
          fi
