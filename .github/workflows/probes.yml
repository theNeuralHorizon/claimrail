# Example workflow that demonstrates how customers would configure automated
# probing in their own deployed instance. Disabled by default so this example
# doesn't run on every fork.
name: Run probes

on:
  # Uncomment the two lines below to enable 5-min polling for your deployment.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit probe endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET must be configured in repo settings."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/probes"
