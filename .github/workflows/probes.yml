# Example workflow that demonstrates how customers would configure automated
# probing in their own deployed instance. Disabled by default so this example
# doesn't run on every fork.
name: Run probes

on:
  # Uncomment the two lines below to enable 5-min polling for your deployment.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit probe endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET must be configured in repo settings."
            exit 0
          fi
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST \
            -w "%{http_code}" \
            -o "$response_file" \
            "$APP_URL/api/cron/probes" || echo "CURL_ERROR")

          body=$(cat "$response_file")
          rm -f "$response_file"

          if [ "$http_code" = "503" ] && echo "$body" | grep -q -i -E "suspended|suspension"; then
            echo "::warning::The live deployment at $APP_URL is suspended on the hosting provider. Skipping probe gracefully to avoid CI notification spam."
            exit 0
          elif [ "$http_code" = "CURL_ERROR" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Request failed with HTTP status $http_code"
            echo "Response body:"
            echo "$body"
            exit 22
          fi
